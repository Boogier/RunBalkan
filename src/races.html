<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="stylesheet" href="/pages.css">
    <title>Running events in the Balkans — Run-Balkan</title>
    <meta name="description" content="Calendar of trail, road and OCR running events in Serbia and the Balkans.">

    <script src="/yandex-metrika.js"></script>

</head>
<body class="races-page">
    <div class="races-top">
        <a href="/" class="back-link" data-i18n="backToMap">← Back to map</a>
        <div class="races-top-right">
            <nav id="lang-switch" class="races-lang" data-i18n-aria="language" aria-label="Language">
                <button type="button" data-lang="en">EN</button>
                <span>·</span>
                <button type="button" data-lang="sr">SR</button>
                <span>·</span>
                <button type="button" data-lang="ru">RU</button>
            </nav>
            <div id="races-updated" class="races-updated"></div>
        </div>
    </div>

    <h1 data-i18n="heading">Running events in the Balkans and near</h1>

    <div class="races-filters">
        <div id="filter-country" class="country-filter">
            <button id="country-toggle" type="button" class="country-toggle" aria-haspopup="true"
                aria-expanded="false">All countries</button>
            <div id="country-menu" class="country-menu" role="group" data-i18n-aria="countries"
                aria-label="Countries" hidden></div>
        </div>
        <select id="filter-type" data-i18n-aria="type" aria-label="Type">
            <option value="" data-i18n="allTypes">All types</option>
            <option value="Trail">Trail</option>
            <option value="Asphalt">Asphalt</option>
            <option value="OCR">OCR</option>
            <option value="Other">Other</option>
        </select>
        <select id="filter-distance" data-i18n-aria="distance" aria-label="Distance">
            <option value="" data-i18n="anyDistance">Any distance</option>
            <option value="0-10">Up to 10 km</option>
            <option value="10-21.1">10–21 km</option>
            <option value="21.1-42.2">21–42 km</option>
            <option value="42.2-">Ultra 42+ km</option>
        </select>
        <input id="filter-search" type="search" placeholder="Search by name or city" data-i18n-placeholder="search"
            data-i18n-aria="search" aria-label="Search by name or city">
        <label class="races-past"><input id="filter-past" type="checkbox"> <span data-i18n="showPast">Show past</span></label>
    </div>

    <div id="races-count" class="races-count"></div>

    <div id="races-list" class="races-list">
        <p class="races-message" data-i18n="loading">Loading…</p>
    </div>

    <footer>
        <p><span>&copy; Boogier 2026</span> · <span data-i18n="sources">Sources:</span> trka.rs, runtrace.net, itra.run</p>
    </footer>
</body>
</html>
